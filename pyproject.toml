[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mapper-moa"
version = "0.1.0"
description = "Antibiotic mode-of-action prediction from multimodal cellular responses"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "MAPPER contributors"}]
dependencies = ["numpy", "pandas", "scipy", "scikit-learn"]

[project.optional-dependencies]
figures = ["matplotlib", "seaborn", "Pillow", "PyMuPDF", "nbformat", "nbclient", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
